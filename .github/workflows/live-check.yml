name: Live API check

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    # The SDK's uploadVideo timeoutMs does not cover the storage PUT, and that PUT
    # happens before the script's own 10 minute poll deadline starts. Without this,
    # a stalled connection there is bounded only by the runner's 360 minute default,
    # which can quietly burn hours of Actions minutes on a single hung weekly run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/live-check.mjs
        env:
          HYPERSERVE_API_KEY: ${{ secrets.HYPERSERVE_API_KEY }}
