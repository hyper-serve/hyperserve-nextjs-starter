name: Live API check

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/live-check.mjs
        env:
          HYPERSERVE_API_KEY: ${{ secrets.HYPERSERVE_API_KEY }}
